<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Finanze</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f2ec; --card: #ffffff; --ink: #14213d; --muted: #6b7083; --line: #e3e0d6;
  --accent: #b8891a; --accent-soft: #f6ecd2;
  --blu: #1f4fd1; --verde: #1b8a4c; --rosso: #c4372b; --giallo-bg: #fff6dc; --giallo: #8a6100;
  --radius: 16px; --nav-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1424; --card: #18203a; --ink: #eef0f6; --muted: #9aa1b8; --line: #2a3352;
    --accent: #e0b545; --accent-soft: #2d2a1c;
    --blu: #7ea2ff; --verde: #4cc985; --rosso: #ff7b6e; --giallo-bg: #2e2812; --giallo: #f0c35a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); }
header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
header.top h1 span { color: var(--accent); }
.icon-btn { background: none; border: 0; color: var(--ink); font-size: 20px; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
main { padding: 14px 16px; max-width: 640px; margin: 0 auto; }
h2 { font-size: 17px; margin: 22px 0 10px; }
h3 { font-size: 15px; margin: 16px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.hero { background: var(--ink); color: #fff; border: 0; }
@media (prefers-color-scheme: dark) { .hero { background: #233163; } }
.hero .lbl { opacity: .75; font-size: 13px; }
.hero .big { font-size: 30px; font-weight: 700; margin: 2px 0 6px; letter-spacing: -.3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi .lbl { color: var(--muted); font-size: 12.5px; }
.kpi .val { font-size: 18px; font-weight: 650; margin-top: 2px; }
.verde { color: var(--verde); } .rosso { color: var(--rosso); } .blu { color: var(--blu); } .muted { color: var(--muted); }
.azioni { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 12px; padding: 12px 14px; font: inherit; font-weight: 600; cursor: pointer; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1404; }
.btn.blu { background: var(--blu); border-color: var(--blu); color: #fff; }
.btn.danger { color: var(--rosso); }
.btn.big { padding: 16px; font-size: 16px; }
.btn.small { padding: 7px 10px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.list .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.list .item:last-child { border-bottom: 0; }
.item .t { font-weight: 600; } .item .s { color: var(--muted); font-size: 12.5px; }
.item .imp { font-weight: 650; white-space: nowrap; }
label.f { display: block; font-weight: 600; font-size: 13.5px; margin: 14px 0 5px; }
input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink); font: inherit; }
textarea { resize: vertical; min-height: 70px; }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 13px; line-height: 1.45; }
.hint b { display: block; margin-bottom: 2px; }
.warn { background: var(--giallo-bg); color: var(--ink); border-left: 4px solid var(--giallo); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
.err { background: rgba(196,55,43,.1); border-left: 4px solid var(--rosso); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 13px; font: inherit; font-size: 14px; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--line); padding: 4px; border-radius: 13px; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 9px 2px; border-radius: 10px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.riga-sc { display: grid; grid-template-columns: 1fr 78px 92px 34px; gap: 6px; margin-bottom: 6px; }
.riga-sc select, .riga-sc input { padding: 9px 8px; font-size: 14px; }
.tot { font-size: 13.5px; margin-top: 6px; }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
nav.bottom button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
nav.bottom button .ic { font-size: 21px; line-height: 1; }
nav.bottom button.on { color: var(--ink); font-weight: 700; }
nav.bottom button.plus .ic { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #1b1404; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -22px; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.tree .nodo { display: flex; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tree .nodo .n { flex: 1; min-width: 0; }
.tree .nodo .n .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .cartella > .n .t { font-weight: 700; }
.tree .nascosto { opacity: .45; }
.tree .car { width: 18px; color: var(--muted); text-align: center; }
.sez-title { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 4px; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
#sheetWrap { position: fixed; inset: 0; z-index: 20; background: rgba(10,14,28,.45); display: none; align-items: flex-end; justify-content: center; }
#sheetWrap.on { display: flex; }
#sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); }
#sheet h3 { margin-top: 0; }
#overlay { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(10,14,28,.55); color: #fff; flex-direction: column; gap: 14px; font-weight: 600; text-align: center; padding: 20px; }
#overlay.on { display: flex; }
.spinner { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: gira 0.9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; display: none; max-width: 90vw; text-align: center; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 15px; white-space: normal; }
.msg.u { align-self: flex-end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 4px; }
.msg.a { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg ul { margin: 4px 0; padding-left: 18px; }
.chat-input { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: var(--bg); padding: 10px 0 4px; display: flex; gap: 8px; }
.chat-input textarea { min-height: 46px; max-height: 140px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--line); color: var(--ink); }
.badge.alta { background: rgba(27,138,76,.15); color: var(--verde); }
.badge.media { background: var(--giallo-bg); color: var(--giallo); }
.badge.bassa { background: rgba(196,55,43,.12); color: var(--rosso); }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t td { padding: 6px 2px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.num { text-align: right; white-space: nowrap; }
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; }
.check input { width: 20px; height: 20px; }
.vuoto { text-align: center; color: var(--muted); padding: 24px 10px; }
</style>
</head>
<body>

<header class="top">
  <h1>Finanze<span>.</span></h1>
  <div class="row">
    <button class="icon-btn" id="btnRefresh" title="Aggiorna" aria-label="Aggiorna">⟳</button>
    <button class="icon-btn" id="btnSettings" title="Impostazioni" aria-label="Impostazioni">⚙︎</button>
  </div>
</header>

<main id="main"></main>

<nav class="bottom" id="nav">
  <button data-v="home"><span class="ic">⌂</span>Home</button>
  <button data-v="registro"><span class="ic">☰</span>Registro</button>
  <button data-v="nuovo" class="plus" aria-label="Nuovo movimento"><span class="ic">+</span></button>
  <button data-v="conti"><span class="ic">▤</span>Conti</button>
  <button data-v="assistente"><span class="ic">✦</span>Assistente</button>
</nav>

<div id="sheetWrap"><div id="sheet"></div></div>
<div id="overlay"><div class="spinner"></div><div id="overlayMsg">Attendere…</div></div>
<div id="toast"></div>
<input type="file" id="fileFoto" accept="image/*" hidden>

<script>
/* ═════════════ Stato e utilità ═════════════ */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const CFG = { url: LS.get('fin_url') || '', token: LS.get('fin_token') || '' };
let D = null;                 // dati dall'app (datiApp)
let VISTA = 'home';
let MAPPA = {};               // codice -> conto
let F = null;                 // stato del modulo Nuovo (creato all'avvio)
let PROPOSTE = [];            // proposte dall'AI
let CHAT = [];                // messaggi assistente
let CTX = '';                 // contesto per l'assistente
let MOSTRA_NASCOSTI = false;
const CHIUSE = new Set();     // cartelle chiuse nell'albero
const TIPI = ['Uscita', 'Entrata', 'Trasferimento', 'Altro'];
const PATR = ['ATT+', 'ATT-', 'PAS'];
const REGOLE = {
  Entrata:       { l1: 'Conto di ricavo',        s1: ['RIC'], l2: 'Dove arrivano i soldi',     s2: PATR },
  Uscita:        { l1: 'Da dove escono i soldi', s1: PATR,    l2: 'Categoria di spesa',        s2: ['COS'] },
  Trasferimento: { l1: 'Da (conto di origine)',  s1: PATR,    l2: 'A (conto di destinazione)', s2: PATR }
};
const NOMI_SEZ = { 'ATT+': 'Attività produttive', 'ATT-': 'Attività', 'PAS': 'Passività', 'PN': 'Patrimonio netto', 'RIC': 'Ricavi', 'COS': 'Costi' };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (Number(n) || 0).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
const oggiISO = (off = 0) => { const d = new Date(); d.setDate(d.getDate() - off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dataIT = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; };
function num(s) { s = String(s == null ? '' : s).trim().replace(/\s|€/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? 0 : Math.round(n * 100) / 100; }
function cmpCod(a, b) { const pa = a.split('.'), pb = b.split('.'); for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const x = pa[i] === undefined ? -1 : +pa[i], y = pb[i] === undefined ? -1 : +pb[i]; if (x !== y) return x - y; } return 0; }
function nuovoForm(tipo) { return { tipo: tipo || 'Uscita', data: oggiISO(), descrizione: '', importo: '', avere: '', dare: '', righe: [{ conto: '', lato: 'AVERE', imp: '' }, { conto: '', lato: 'DARE', imp: '' }], etichetta: '' }; }

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms); }
function attesa(on, msg) { $('#overlay').classList.toggle('on', !!on); if (msg) $('#overlayMsg').textContent = msg; }

async function api(azione, dati = {}) {
  if (!CFG.url || !CFG.token) throw new Error('Configura prima URL e token nelle impostazioni (⚙︎).');
  let r;
  try { r = await fetch(CFG.url, { method: 'POST', body: JSON.stringify({ token: CFG.token, azione, dati }) }); }
  catch (e) { throw new Error('Connessione non riuscita: controlla internet e l’URL dello script.'); }
  let j;
  try { j = await r.json(); }
  catch (e) { throw new Error('Risposta non valida: l’URL deve finire con /exec e il deployment deve essere accessibile a "Chiunque".'); }
  if (!j.ok && !j.richiedeConferma) throw new Error(j.errore || 'Errore sconosciuto');
  return j;
}

function impostaDati(d) {
  D = d;
  MAPPA = {};
  (d.conti || []).forEach(c => MAPPA[c.codice] = c);
  LS.set('fin_cache', JSON.stringify(d));
  LS.set('fin_cache_ora', new Date().toISOString());
}

async function caricaDati(mostra = true) {
  if (mostra) attesa(true, 'Carico i tuoi conti…');
  try { impostaDati(await api('datiApp')); return true; }
  catch (e) { if (mostra) toast(e.message, 4500); return false; }
  finally { if (mostra) attesa(false); }
}

/* ═════════════ Conti: helper ═════════════ */
function contiAttivi(sezioni) {
  return D.conti.filter(c => c.attivo && c.tipo !== 'Cartella' && (!sezioni || sezioni.indexOf(c.sezione) >= 0));
}
function percorso(cod) { const n = []; let k = cod, g = 0; while (k && MAPPA[k] && g++ < 20) { n.unshift(MAPPA[k].nome); k = MAPPA[k].padre; } return n.join(' › '); }
function figli(cod) { return D.conti.filter(c => c.padre === cod).sort((a, b) => cmpCod(a.codice, b.codice)); }
function discendenti(cod) { const out = []; figli(cod).forEach(f => { out.push(f.codice); out.push(...discendenti(f.codice)); }); return out; }
function opzioniConti(sezioni, sel) {
  let h = '<option value="">— scegli —</option>', grp = null;
  contiAttivi(sezioni).forEach(c => {
    const g = MAPPA[c.padre] ? MAPPA[c.padre].nome : NOMI_SEZ[c.sezione];
    if (g !== grp) { if (grp !== null) h += '</optgroup>'; grp = g; h += '<optgroup label="' + esc(g) + '">'; }
    h += '<option value="' + esc(c.codice) + '"' + (c.codice === sel ? ' selected' : '') + '>' + esc(c.nome) + '</option>';
  });
  if (grp !== null) h += '</optgroup>';
  return h;
}
function guida(k) { return D && D.guida ? D.guida[k] : null; }
function hint(x) {
  if (!x) return '';
  return '<div class="hint"><b>' + esc(x.titolo) + '</b>' + esc(x.suggerimento) +
    (x.esempio ? '<br>✅ ' + esc(x.esempio) : '') + (x.errore ? '<br>⚠️ ' + esc(x.errore) : '') + '</div>';
}
function riassuntoMovimento(m) {
  const d = m.righe.filter(r => r.dare), a = m.righe.filter(r => r.avere);
  return (a.map(r => r.nome).join(', ') || '?') + ' → ' + (d.map(r => r.nome).join(', ') || '?');
}
function coloreMovimento(m) {
  if (m.righe.some(r => r.sezione === 'COS' && r.dare)) return 'rosso';
  if (m.righe.some(r => r.sezione === 'RIC' && r.avere)) return 'verde';
  return '';
}

/* ═════════════ Navigazione ═════════════ */
function vai(v, push = true) {
  VISTA = v;
  if (push) history.pushState({ v }, '', '#' + v);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  window.scrollTo(0, 0);
  render();
}
window.addEventListener('popstate', e => {
  if ($('#sheetWrap').classList.contains('on')) { chiudiSheet(); history.pushState({ v: VISTA }, '', '#' + VISTA); return; }
  vai((e.state && e.state.v) || 'home', false);
});

function render() {
  if (!CFG.url || !CFG.token) return vistaSetup();
  if (!D) return ($('#main').innerHTML = '<div class="vuoto">Caricamento…</div>');
  ({ home: vistaHome, nuovo: vistaNuovo, conti: vistaConti, registro: vistaRegistro, assistente: vistaAssistente,
     proposte: vistaProposte, fiscale: vistaFiscale, ricorrenti: vistaRicorrenti, impostazioni: vistaSetup }[VISTA] || vistaHome)();
}

/* ═════════════ Setup / impostazioni ═════════════ */
function vistaSetup() {
  $('#main').innerHTML = `
    <h2>Collega l'app al tuo foglio</h2>
    <div class="card">
      <label class="f">URL dell'app web (finisce con /exec)</label>
      <input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.url)}" autocomplete="off">
      <div class="hint">In Apps Script: <b>Esegui il deployment → Gestisci deployment</b>, copia "URL app web".</div>
      <label class="f">Token API</label>
      <input id="sTok" placeholder="xxxxxxxx-xxxx-…" value="${esc(CFG.token)}" autocomplete="off">
      <div class="hint">Nel foglio: menu <b>💰 Finanze → Mostra token API</b>.</div>
      <button class="btn primary block big" id="sSalva" style="margin-top:16px">Salva e collega</button>
      <div id="sMsg"></div>
    </div>
    ${CFG.url ? '<button class="btn block danger" id="sEsci">Scollega questo telefono</button>' : ''}
    <p class="muted" style="font-size:12.5px;margin-top:18px">URL e token restano solo su questo telefono. I tuoi dati vivono nel tuo Google Sheet.</p>`;
  $('#sSalva').onclick = async () => {
    CFG.url = $('#sUrl').value.trim(); CFG.token = $('#sTok').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(CFG.url)) { $('#sMsg').innerHTML = '<div class="err">L’URL deve iniziare con https://script.google.com/ e finire con /exec</div>'; return; }
    LS.set('fin_url', CFG.url); LS.set('fin_token', CFG.token);
    attesa(true, 'Provo il collegamento…');
    try { impostaDati(await api('datiApp')); attesa(false); toast('Collegato ✓'); vai('home'); }
    catch (e) { attesa(false); $('#sMsg').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  };
  if ($('#sEsci')) $('#sEsci').onclick = () => {
    if (!confirm('Scollegare il telefono? I dati nel foglio non vengono toccati.')) return;
    ['fin_url', 'fin_token', 'fin_cache', 'fin_cache_ora'].forEach(k => LS.del(k));
    CFG.url = ''; CFG.token = ''; D = null; render();
  };
}

/* ═════════════ Home ═════════════ */
function vistaHome() {
  const r = D.riepilogo || {};
  const ora = LS.get('fin_cache_ora');
  $('#main').innerHTML = `
    <div class="card hero">
      <div class="lbl">Patrimonio netto</div>
      <div class="big">${eur(r.patrimonioNetto)}</div>
      <div class="lbl">Utile ${esc(r.anno)}: <b>${eur(r.utileAnno)}</b></div>
    </div>
    <div class="grid2">
      <div class="card kpi"><div class="lbl">Liquidità disponibile</div><div class="val blu">${eur(r.liquidita)}</div></div>
      <div class="card kpi"><div class="lbl">Indipendenza finanziaria</div><div class="val">${((r.indipendenza || 0) * 100).toFixed(1).replace('.', ',')}%</div></div>
      <div class="card kpi"><div class="lbl">Ricavi da gennaio</div><div class="val verde">${eur(r.ricaviAnno)}</div></div>
      <div class="card kpi"><div class="lbl">Costi da gennaio</div><div class="val rosso">${eur(r.costiAnno)}</div></div>
    </div>
    <div class="azioni">
      <button class="btn primary big" id="hFoto">📷 Foto / screenshot</button>
      <button class="btn big" id="hNuovo">✍️ Nuovo movimento</button>
    </div>
    ${(D.scadenze || []).length ? '<h2>🔔 Da confermare</h2>' + D.scadenze.map((x, i) => `

function disegnaRighe() {
  const el = $('#nRighe');

    const i = +div.dataset.i;
    div.querySelector('.rx').onclick = () => { leggiForm(); F.righe.splice(i, 1); disegnaRighe(); };
    div.querySelector('.ri').oninput = () => { leggiForm(); totRighe(); };
    div.querySelector('.rl').onchange = () => { leggiForm(); totRighe(); };

function totRighe() {
  let d = 0, a = 0;
  F.righe.forEach(r => { const v = num(r.imp); if (r.lato === 'DARE') d += v; else a += v; });
  d = Math.round(d * 100) / 100; a = Math.round(a * 100) / 100;
  const ok = d === a && d > 0;
  $('#nTot').innerHTML = 'Totale Dare <b>' + eur(d) + '</b> · Totale Avere <b>' + eur(a) + '</b><br>' +
    (ok ? '<b class="verde">Dare = Avere · quadra ✓</b>' : '<b class="rosso">Non quadra: differenza ' + eur(Math.abs(d - a)) + '</b>');
}

function descriviForm() {

    F.righe.map(r => n(r.conto) + ' ' + r.lato + ' ' + (r.imp || '0')).join('; ');
  const r = REGOLE[F.tipo];
  return 'tipo ' + F.tipo + ', data ' + F.data + ', descrizione "' + F.descrizione + '", importo ' + (F.importo || '?') +
    ', ' + r.l1 + ': ' + n(F.avere) + ', ' + r.l2 + ': ' + n(F.dare);
}

/** Salva un movimento (dal modulo o da una proposta). Ritorna {ok, avvisi} */
async function registra(m, forza) {
  if (m.tipo === 'Altro') {
    const righe = m.righe.map(r => ({ conto: r.conto, dare: r.lato === 'DARE' ? num(r.imp) : 0, avere: r.lato === 'AVERE' ? num(r.imp) : 0 }));
    await api('registraScrittura', { data: m.data, descrizione: m.descrizione, etichetta: m.etichetta, righe, origine: m.origine || 'APP' });
    return { ok: true };
  }
  const j = await api('registraSemplice', { tipo: m.tipo, data: m.data, descrizione: m.descrizione, importo: m.importo,
    contoAvere: m.avere, contoDare: m.dare, etichetta: m.etichetta, forza: !!forza, origine: m.origine || 'APP' });
  return j;
}

async function salvaForm(forza) {
  leggiForm();
  $('#nSalva').disabled = true;
  attesa(true, 'Registro…');
  try {
    const j = await registra(F, forza);
    if (j.richiedeConferma) {
      $('#nMsg').innerHTML = '<div class="warn"><b>Controlla prima di salvare:</b><br>' + j.avvisi.map(esc).join('<br><br>') +
        '<div class="grid2" style="margin-top:10px"><button class="btn small" id="nForza">È giusto, salva</button><button class="btn small" id="nChiedi">✦ Chiedi</button></div></div>';
      $('#nForza').onclick = () => salvaForm(true);
      $('#nChiedi').onclick = () => { CTX = 'Movimento in compilazione: ' + descriviForm() + '. Avvisi dell’app: ' + j.avvisi.join(' '); vai('assistente'); };
      return;
    }
    const tipo = F.tipo, data = F.data;
    F = nuovoForm(tipo); F.data = data;
    await caricaDati(false);
    toast('Registrato ✓');
    render();
  } catch (e) {
    $('#nMsg').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
  } finally {
    attesa(false);
    if ($('#nSalva')) $('#nSalva').disabled = false;
  }
}

$('#fileFoto').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!D.aiAttiva) { toast('Prima imposta la chiave Gemini dal menu del foglio.', 4500); return; }
  attesa(true, 'Leggo il documento…');
  try {
    const b64 = await comprimi(file);
    const j = await api('analizzaImmagine', { immagine: b64, mimeType: 'image/jpeg' });
    PROPOSTE = (j.movimenti || []).map(m => propostaInForm(m));
    PROPOSTE.messaggio = j.messaggio || '';
    vai('proposte');
  } catch (err) { toast(err.message, 5000); }
  finally { attesa(false); }
};

function comprimi(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('Immagine non leggibile.'));
    img.src = url;
  });
}

function propostaInForm(m) {
  const f = nuovoForm(m.tipo);
  f.data = m.data || oggiISO(); f.descrizione = m.descrizione || ''; f.origine = 'AI';
  f.importo = m.importo ? String(m.importo).replace('.', ',') : '';
  f.avere = m.contoAvere || ''; f.dare = m.contoDare || '';
  if (m.tipo === 'Altro' && m.righe && m.righe.length) {
    f.righe = m.righe.map(r => ({ conto: r.conto || '', lato: r.dare ? 'DARE' : 'AVERE', imp: String(r.dare || r.avere).replace('.', ',') }));
  }
  f.confidenza = m.confidenza; f.note = m.note; f.stato = 'da fare';
  return f;
}

function vistaConti() {
  const sezioni = ['ATT+', 'ATT-', 'PAS', 'PN', 'RIC', 'COS'];

    <div class="row between"><h2>Conti</h2><button class="btn small primary" id="cNuovo">+ Nuova voce</button></div>

  const el = $('#cAlbero');
  let html = '';
  sezioni.forEach(sez => {
    const radici = D.conti.filter(c => c.sezione === sez && !c.padre);
    if (!radici.length) return;
    const patr = PATR.indexOf(sez) >= 0;
    const tot = radici.reduce((s, c) => s + (c.saldo || 0), 0);
    html += `<div class="sez-title"><span>${esc(NOMI_SEZ[sez])}</span><span>${patr ? eur(tot) : ''}</span></div><div class="card" style="padding:4px 10px">`;
    radici.forEach(r => html += nodo(r, 0));
    html += '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.nodo').forEach(n => {
    n.onclick = e => {
      const c = MAPPA[n.dataset.c];
      if (e.target.classList.contains('car') && c.tipo === 'Cartella') { CHIUSE.has(c.codice) ? CHIUSE.delete(c.codice) : CHIUSE.add(c.codice); vistaConti(); return; }
      schedaConto(c);
    };
  });
  $('#cNasc').onchange = e => { MOSTRA_NASCOSTI = e.target.checked; vistaConti(); };
  $('#cNuovo').onclick = () => formNuovaVoce('');
}

function nodo(c, liv) {
  if (!c.attivo && !MOSTRA_NASCOSTI) return '';
  const cart = c.tipo === 'Cartella';
  const patr = PATR.indexOf(c.sezione) >= 0;
  const chiusa = CHIUSE.has(c.codice);
  let h = `<div class="nodo ${cart ? 'cartella' : ''} ${c.attivo ? '' : 'nascosto'}" data-c="${esc(c.codice)}" style="padding-left:${4 + liv * 16}px">
    <span class="car">${cart ? (chiusa ? '▸' : '▾') : '·'}</span>
    <div class="n"><div class="t">${esc(c.nome)}</div>${!c.attivo ? '<div class="s muted">nascosto</div>' : ''}</div>
    <div class="imp ${c.saldo < 0 ? 'rosso' : ''}" style="font-size:14px">${patr && (c.saldo || !cart) ? eur(c.saldo) : ''}</div>
  </div>`;
  if (cart && !chiusa) figli(c.codice).forEach(f => h += nodo(f, liv + 1));
  return h;
}

function schedaConto(c) {
  const cart = c.tipo === 'Cartella';
  const patr = PATR.indexOf(c.sezione) >= 0;
  const sistema = (D.sistema || []).indexOf(c.codice) >= 0;
  const haFigli = figli(c.codice).length > 0;
  const eliminabile = !sistema && c.padre && !haFigli && !c.haMovimenti;
  apriSheet(`
    <h3>${esc(c.nome)}</h3>
    <div class="muted" style="font-size:13px">${esc(percorso(c.codice))} · codice ${esc(c.codice)}</div>
    ${patr ? `<div style="font-size:22px;font-weight:700;margin:10px 0">${eur(c.saldo)}</div>` : ''}
    ${c.suggerimento ? '<div class="hint">💡 ' + esc(c.suggerimento) + '</div>' : ''}
    ${sistema ? '<div class="hint">Voce di sistema: la usa l’app per le scritture automatiche.</div>' : ''}
    <div style="display:grid;gap:8px;margin-top:14px">
      <button class="btn block" id="kMod">✏️ Modifica / sposta</button>
      ${cart ? '<button class="btn block" id="kAdd">➕ Aggiungi una voce qui dentro</button>' : ''}
      ${patr && !cart ? '<button class="btn block" id="kSaldo">🏁 Saldo iniziale</button>' : ''}
      ${patr && !cart ? `<button class="btn block" id="kAll">${c.mtm ? '📈 Aggiorna al valore di mercato' : '🔄 Riallinea al valore reale'}</button>` : ''}
      ${c.padre && !sistema ? `<button class="btn block" id="kVis">${c.attivo ? '🙈 Nascondi' : '👁 Riattiva'}</button>` : ''}

function md(t) {
  const inline = x => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const righe = esc(t).split('\n'); let out = '', inLista = false;
  righe.forEach(r => {
    const m = r.match(/^(\s*)(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) {
      if (!inLista) { out += '<ul>'; inLista = true; }
      const liv = Math.min(3, Math.floor(m[1].replace(/\t/g, '    ').length / 2));
      out += '<li' + (liv ? ' style="margin-left:' + (liv * 14) + 'px;list-style:circle"' : '') + '>' + inline(m[2]) + '</li>';
    }
    else { if (inLista) { out += '</ul>'; inLista = false; } out += r ? inline(r) + '<br>' : '<br>'; }
  });
  if (inLista) out += '</ul>';
  return out.replace(/(<br>)+$/, '');
}

    <div class="chat" id="aChat" style="margin-top:12px">

      ${CHAT.map(m => `<div class="msg ${m.ruolo === 'utente' ? 'u' : 'a'}">${m.ruolo === 'utente' ? esc(m.testo) : md(m.testo)}</div>`).join('')}

async function invia(testo) {
  testo = String(testo || '').trim();
  if (!testo) return;
  const storia = CHAT.slice();
  CHAT.push({ ruolo: 'utente', testo });
  vistaAssistente();
  $('#aChat').insertAdjacentHTML('beforeend', '<div class="msg a muted" id="aPens">Sto pensando…</div>');
  window.scrollTo(0, document.body.scrollHeight);
  try {
    const j = await api('assistente', { domanda: testo, storia, contesto: CTX || ('Schermata: ' + VISTA) });
    CHAT.push({ ruolo: 'assistente', testo: j.risposta });
  } catch (e) {
    CHAT.push({ ruolo: 'assistente', testo: '⚠️ ' + e.message });
  }
  if (VISTA === 'assistente') vistaAssistente();
}

function prossimoGiorno(g) {
  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const fai = (y, m) => new Date(y, m, Math.min(g, new Date(y, m + 1, 0).getDate()));
  let d = fai(oggi.getFullYear(), oggi.getMonth());
  if (d < oggi) d = fai(oggi.getFullYear(), oggi.getMonth() + 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

  let corpo = `<label class="f">Nome</label><input id="fNome" value="${esc(r ? r.nome : (t === 'RATA' ? 'Rata auto' : t === 'CARTA' ? 'Saldo ' + ((carte.find(c => /carta/i.test(c.nome)) || {}).nome || 'carta di credito') : ''))}" placeholder="es. Affitto, Netflix, Stipendio">`;
  if (t === 'RATA') corpo += `
    <label class="f">Importo della rata</label><input id="fImp" inputmode="decimal" placeholder="es. 250,00">
    <label class="f">Rate ancora da pagare (compresa la prossima)</label><input id="fRes" inputmode="numeric" placeholder="es. 36">
    <label class="f">Data della prossima rata</label><input type="date" id="fData" value="${prossimoGiorno(new Date().getDate())}">
    <label class="f">Da quale conto esce</label><select id="fAvere">${opzioniConti(PATR, contoBanca)}</select>
    <label class="check"><input type="checkbox" id="fDeb" checked> Crea il debito residuo tra le Passività (rata × rate residue)</label>
    <div id="fDebBox"><label class="f">Nome del debito</label><input id="fDebNome" placeholder="es. Finanziamento auto"></div>
    <div id="fVersoBox" style="display:none"><label class="f">Verso quale conto</label><select id="fDare">${opzioniConti(['PAS', 'COS'], '')}</select></div>
    <div class="hint">Ogni rata confermata è un Trasferimento conto → debito: il debito scende fino a zero all'ultima rata. Il debito comprende anche gli interessi futuri, quindi è una stima prudente. Il calo di valore dell'auto è un'altra cosa: si gestisce nel foglio Ammortamenti.</div>`;
  else if (t === 'CARTA') corpo += `
    <label class="f">Carta di credito</label><select id="fDare">${opzioniConti(['PAS'], r ? r.dare : (carte.find(c => /carta/i.test(c.nome)) || {}).codice)}</select>
    <label class="f">Da quale conto viene addebitata</label><select id="fAvere">${opzioniConti(PATR, r ? r.avere : contoBanca)}</select>
    <div class="grid2">
      <div><label class="f">Giorno di chiusura</label><input id="fChius" inputmode="numeric" value="${r ? r.chiusura : 15}"></div>
      <div><label class="f">Giorno di addebito</label><input id="fGiorno" inputmode="numeric" value="${r ? r.giorno : 5}"></div>
    </div>
    ${r ? `<label class="f">Prossimo addebito</label><input type="date" id="fData" value="${esc(r.prossima)}">` : ''}
    <div class="hint">Il giorno dell'addebito l'app somma le spese registrate sulla carta fino al giorno di chiusura del mese prima (es. fino al 15 ottobre per l'addebito del 5 novembre) e ti propone il trasferimento dal conto. Registra le spese con la carta come Uscite dalla carta.</div>`;
  else corpo += `
    <label class="f">Importo</label><input id="fImp" inputmode="decimal" value="${r ? String(r.importo).replace('.', ',') : ''}" placeholder="es. 15,99">
    <label class="f">Da (conto che paga, o ricavo per un'entrata)</label><select id="fAvere">${opzioniConti(null, r ? r.avere : contoBanca)}</select>
    <label class="f">A (categoria di costo, o conto che riceve)</label><select id="fDare">${opzioniConti(null, r ? r.dare : '')}</select>
    <label class="f">Prossima scadenza</label><input type="date" id="fData" value="${r ? esc(r.prossima) : prossimoGiorno(new Date().getDate())}">
    <div class="grid2">
      <div><label class="f">Ogni quanti mesi</label><input id="fMesi" inputmode="numeric" value="${r ? r.mesi : 1}"></div>
      <div><label class="f">Volte residue</label><input id="fRes" inputmode="numeric" value="${r && r.residue !== null ? r.residue : ''}" placeholder="vuoto = senza fine"></div>
    </div>
    <div class="hint">Spesa fissa: Da = conto corrente, A = categoria di costo. Entrata fissa (stipendio): Da = conto di ricavo, A = conto corrente.</div>`;
  if (r) corpo += `<label class="check"><input type="checkbox" id="fAtt" ${r.attivo ? 'checked' : ''}> Attivo</label>`;
  apriSheet(`<h3>${titoli[t]}</h3>${corpo}
    <div class="grid2" style="margin-top:16px"><button class="btn" id="fAnn">Annulla</button><button class="btn primary" id="fOk">Salva</button></div>
    ${r ? '<button class="btn block danger" id="fDel" style="margin-top:10px">🗑 Elimina regola</button><p class="muted" style="font-size:12.5px">Eliminare la regola non cancella i movimenti già registrati.</p>' : ''}`, s => {
    const q = id => s.querySelector(id);
    if (q('#fDeb')) q('#fDeb').onchange = e => { q('#fDebBox').style.display = e.target.checked ? '' : 'none'; q('#fVersoBox').style.display = e.target.checked ? 'none' : ''; };
    q('#fAnn').onclick = chiudiSheet;
    if (q('#fDel')) q('#fDel').onclick = () => { if (confirm('Eliminare la regola "' + r.nome + '"?')) azioneConto('eliminaRicorrente', { id: r.id }, 'Eliminato'); };
    q('#fOk').onclick = () => {
      const d = { nome: q('#fNome').value, avere: q('#fAvere').value };
      if (r) { d.id = r.id; d.attivo = q('#fAtt').checked; }
      if (t === 'CARTA') {
        d.tipo = 'SALDO_CARTA'; d.dare = q('#fDare').value; d.chiusura = q('#fChius').value; d.giorno = q('#fGiorno').value; d.mesi = 1;
        d.prossima = q('#fData') ? q('#fData').value : prossimoGiorno(+d.giorno || 5);
      } else {
        d.tipo = 'FISSO'; d.importo = q('#fImp').value; d.prossima = q('#fData').value; d.residue = q('#fRes').value;
        d.mesi = q('#fMesi') ? q('#fMesi').value : 1;
        d.giorno = d.prossima ? +d.prossima.split('-')[2] : 1;
        if (t === 'RATA' && q('#fDeb').checked) { d.creaDebito = true; d.nomeDebito = q('#fDebNome').value || ('Finanziamento ' + d.nome); }
        else d.dare = q('#fDare').value;
      }
      azioneConto('salvaRicorrente', d, 'Salvato');
    };
  });
}

/* ═════════════ Bottom sheet ═════════════ */
function apriSheet(html, monta) {
  $('#sheet').innerHTML = html;
  $('#sheetWrap').classList.add('on');
  $('#sheet').scrollTop = 0;
  if (monta) monta($('#sheet'));
}
function chiudiSheet() { $('#sheetWrap').classList.remove('on'); }
$('#sheetWrap').onclick = e => { if (e.target.id === 'sheetWrap') chiudiSheet(); };

/* ═════════════ Avvio ═════════════ */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  if (b.dataset.v === 'nuovo' && VISTA !== 'nuovo') F = nuovoForm(F.tipo);
  vai(b.dataset.v);
});
$('#btnSettings').onclick = () => vai('impostazioni');
$('#btnRefresh').onclick = async () => { if (await caricaDati(true)) { toast('Aggiornato ✓'); render(); } };

(async function avvio() {
  F = nuovoForm();
  const cache = LS.get('fin_cache');
  if (cache) { try { impostaDati(JSON.parse(cache)); } catch (e) {} }
  history.replaceState({ v: 'home' }, '', '#home');
  vai('home', false);
  if (CFG.url && CFG.token) { if (await caricaDati(!D)) render(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
